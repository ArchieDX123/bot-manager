name: Build Windows en Mac

# Bouwt de app wanneer er een versie-tag (bv. v2.0.0) wordt gepusht,
# of handmatig via Actions > "Build Windows en Mac" > Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: App bouwen
        run: npm run build

      - name: Windows-versie maken
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Mac-versie maken
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
            app/release/latest*.yml
            app/release/*.blockmap
          if-no-files-found: error

      - name: Toevoegen aan release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Eerst als concept; pas openbaar als Windows én Mac klaar zijn (job "publish").
          draft: true
          body: |
            ## Downloaden

            **Makkelijkste manier:** ga naar de [downloadpagina](https://archiedx123.github.io/bot-manager/) en klik op de grote knop. Die kiest vanzelf de juiste versie en legt de installatie stap voor stap uit.

            Of download hier rechtstreeks:

            | Computer | Bestand |
            |---|---|
            | **Windows** | [Bot-Manager-Setup.exe](https://github.com/ArchieDX123/bot-manager/releases/latest/download/Bot-Manager-Setup.exe) |
            | **Mac** (Apple Silicon en Intel) | [Bot-Manager-Mac.dmg](https://github.com/ArchieDX123/bot-manager/releases/latest/download/Bot-Manager-Mac.dmg) |

            Zie je een waarschuwing? Windows: klik op **Meer info → Toch uitvoeren**. Mac: **Systeeminstellingen → Privacy en beveiliging → Open toch**. Dat hoeft maar één keer.

            <sub>De andere bestanden hieronder (.yml, .blockmap, portable) zijn voor automatische updates en gevorderde gebruikers.</sub>
          files: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
            app/release/latest*.yml
            app/release/*.blockmap

  publish:
    # Maakt de nieuwe versie pas openbaar als beide builds gelukt zijn, zodat de
    # downloadlinks voor Windows en Mac altijd tegelijk werken.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Versie publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
