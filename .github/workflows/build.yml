name: Build Windows en Mac

# Bouwt de app wanneer er een versie-tag (bv. v2.0.0) wordt gepusht,
# of handmatig via Actions > "Build Windows en Mac" > Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: App bouwen
        run: npm run build

      - name: Windows-versie maken
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Mac-versie maken
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: error

      - name: Toevoegen aan release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
